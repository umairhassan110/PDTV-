name: PDTV AI Newsroom

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected PDTV collector
        env:
          SITE_URL: ${{ secrets.PDTV_SITE_URL }}
          CRON_SECRET: ${{ secrets.PDTV_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "PDTV_SITE_URL or PDTV_CRON_SECRET is missing in GitHub Actions secrets."
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-delay 5 --max-time 285 \
            -X POST "${SITE_URL%/}/api/ai-newsroom/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
